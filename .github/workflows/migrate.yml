name: Migrate data.enc to Cloudflare D1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Decrypt docs/data.enc and upload to Cloudflare D1
        env:
          ENCRYPT_PASSWORD: ${{ secrets.ENCRYPT_PASSWORD }}
          CF_WORKER_URL: ${{ secrets.CF_WORKER_URL }}
          CF_INGEST_TOKEN: ${{ secrets.CF_INGEST_TOKEN }}
        run: python migrate_to_cf.py
