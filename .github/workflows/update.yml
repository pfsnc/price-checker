name: Daily Stamp Price Update

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-encrypt:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper & encrypt data
        env:
          ENCRYPT_PASSWORD: ${{ secrets.ENCRYPT_PASSWORD }}
        run: python scraper.py

      - name: Commit and push updated encrypted data
        run: |
          if [ -n "$(git status --porcelain docs/data.enc)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data.enc
            git commit -m "chore: update encrypted stamp prices [skip ci]"
            git push
          else
            echo "No changes to docs/data.enc."
          fi