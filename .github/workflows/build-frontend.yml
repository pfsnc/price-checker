name: Build Frontend Assets

on:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - "src/**"
      - "scripts/**"
      - "docs/index.html"
      - "docs/js/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Tailwind CSS and copy Chart.js
        run: npm run build

      - name: Commit built assets directly to main
        run: |
          if [ -n "$(git status --porcelain package-lock.json docs/css/styles.css docs/vendor/chart.umd.min.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json docs/css/styles.css docs/vendor/chart.umd.min.js
            git commit -m "chore: build frontend static assets [skip ci]"
            git push
          else
            echo "Frontend assets already up to date."
          fi
