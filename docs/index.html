<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>中國郵票雙站行情私人追蹤系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- 密碼鎖定驗證畫面 -->
  <section id="lockScreen" class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200 shadow-lg p-7 space-y-5">
      <div class="text-center space-y-1.5">
        <div class="mx-auto w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl font-bold">
          🔐
        </div>
        <h1 class="text-xl font-bold text-slate-900">私人郵票雙站比價系統</h1>
        <p class="text-xs text-slate-500">資料以 AES-256-GCM 加密儲存，請輸入解密密碼</p>
      </div>

      <form id="unlockForm" class="space-y-4">
        <div>
          <label for="passwordInput" class="block text-xs font-medium text-slate-600 mb-1">存取密碼</label>
          <input id="passwordInput" type="password" required autocomplete="current-password"
            placeholder="輸入 GitHub Secret 設定之密碼"
            class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div id="authError" class="hidden text-xs text-rose-700 bg-rose-50 border border-rose-200 rounded-lg p-2.5"></div>
        <button id="unlockBtn" type="submit"
          class="w-full py-2.5 px-4 rounded-lg bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white text-sm font-medium transition shadow-sm">
          解密並載入儀表板
        </button>
      </form>
    </div>
  </section>

  <!-- 已解密主畫面 -->
  <div id="appScreen" class="hidden">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">
        <div>
          <h1 class="text-lg sm:text-xl font-bold text-slate-900">中國郵票雙站行情追蹤系統</h1>
          <p class="text-xs text-slate-500 mt-0.5">
            志號自然排序 · 同色系深淺雙站對比 · 最後檢查：<span id="headerLastChecked" class="font-medium text-slate-700">-</span>
          </p>
        </div>

        <!-- 同色系深淺圖例 -->
        <div class="flex flex-wrap items-center justify-between lg:justify-end gap-3">
          <div class="flex flex-wrap items-center gap-x-4 gap-y-1 text-[11px] text-slate-600 bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5">
            <span class="inline-flex items-center gap-1.5"><span class="w-3 h-0.5 bg-emerald-700"></span>新票(金投)</span>
            <span class="inline-flex items-center gap-1.5"><span class="w-3 h-0.5 border-t-2 border-dashed border-emerald-400"></span>新票(點購)</span>
            <span class="inline-flex items-center gap-1.5"><span class="w-3 h-0.5 bg-amber-700"></span>蓋銷(金投)</span>
            <span class="inline-flex items-center gap-1.5"><span class="w-3 h-0.5 border-t-2 border-dashed border-amber-400"></span>蓋銷(點購)</span>
            <span class="inline-flex items-center gap-1.5"><span class="w-3 h-0.5 bg-rose-700"></span>信銷(金投)</span>
            <span class="inline-flex items-center gap-1.5"><span class="w-3 h-0.5 border-t-2 border-dashed border-rose-400"></span>信銷(點購)</span>
          </div>
          <button id="lockBtn"
            class="px-3.5 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-100 text-xs font-medium text-slate-700 transition">
            鎖定登出
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-5 space-y-5">
      <!-- 統計摘要 -->
      <section class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div class="text-xs text-slate-500">篩選 / 實體去重後總品種</div>
          <div id="statStamps" class="text-2xl font-bold text-slate-900 mt-1">-</div>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div class="text-xs text-slate-500">雙站價格異動快照筆數</div>
          <div id="statChanges" class="text-2xl font-bold text-slate-900 mt-1">-</div>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
          <div class="text-xs text-slate-500">最後價格異動時間</div>
          <div id="statUpdated" class="text-lg font-bold text-indigo-600 mt-1.5">-</div>
        </div>
      </section>

      <!-- 分類篩選與關鍵字搜尋 -->
      <section class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm">
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
          <div id="categoryTabs" class="flex flex-wrap gap-1.5"></div>
          <div class="w-full md:w-72">
            <input id="searchInput" type="text" placeholder="搜尋名稱或志號（如：T46、紀1、猴）"
              class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
          </div>
        </div>
      </section>

      <!-- 雙站比對主表格（志號自然排序 + 迷你 Sparkline + 點擊展開明細） -->
      <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-slate-200 text-sm">
            <thead class="bg-slate-50 text-slate-600 text-xs uppercase tracking-wider">
              <tr>
                <th class="px-3 py-3 text-left font-semibold w-20">志號</th>
                <th class="px-3 py-3 text-left font-semibold">郵票名稱</th>
                <th class="px-3 py-3 text-center font-semibold w-16">分類</th>
                <th class="px-3 py-3 text-right font-semibold text-emerald-700 w-32">新票 (金投/點購)</th>
                <th class="px-3 py-3 text-right font-semibold text-amber-700 w-32">蓋銷 (金投/點購)</th>
                <th class="px-3 py-3 text-right font-semibold text-rose-700 w-32">信銷 (金投/點購)</th>
                <th class="px-3 py-3 text-center font-semibold w-44">雙站走勢圖</th>
                <th class="px-3 py-3 text-center font-semibold w-24">異動日</th>
                <th class="px-3 py-3 text-center font-semibold w-12">明細</th>
              </tr>
            </thead>
            <tbody id="stampTableBody" class="divide-y divide-slate-100 bg-white"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script>
    const CATEGORIES = ["全部", "特", "紀", "文", "編號", "J", "T", "生肖", "年冊", "其他"];

    // 同色系深淺對比設定：品相決定色系，網站決定深淺與線型
    const SERIES_CONFIG = [
      { key: "site_a_mint", label: "新票 (金投網)", color: "#047857", bg: "rgba(4, 120, 87, 0.12)", dash: [] },
      { key: "site_b_mint", label: "新票 (點購網)", color: "#34d399", bg: "rgba(52, 211, 153, 0.12)", dash: [4, 3] },
      { key: "site_a_cto",  label: "蓋銷 (金投網)", color: "#b45309", bg: "rgba(180, 83, 9, 0.12)", dash: [] },
      { key: "site_b_cto",  label: "蓋銷 (點購網)", color: "#fbbf24", bg: "rgba(251, 191, 36, 0.12)", dash: [4, 3] },
      { key: "site_a_used", label: "信銷 (金投網)", color: "#be123c", bg: "rgba(190, 18, 60, 0.12)", dash: [] },
      { key: "site_b_used", label: "信銷 (點購網)", color: "#fb7185", bg: "rgba(251, 113, 133, 0.12)", dash: [4, 3] },
    ];

    let storeData = null;
    let stampList = [];
    let filteredList = [];
    let currentCategory = "全部";

    const sparklineCharts = new Map();
    const expandedCharts = new Map();
    let sparkObserver = null;

    // ==========================================
    // 自然排序 (Catalog Number 優先，其次 Name)
    // ==========================================
    function naturalTokenize(str) {
      return String(str || "").match(/\d+|\D+/g) || [];
    }

    function naturalCompare(a, b) {
      const ta = naturalTokenize(a);
      const tb = naturalTokenize(b);
      const len = Math.max(ta.length, tb.length);
      for (let i = 0; i < len; i++) {
        if (i >= ta.length) return -1;
        if (i >= tb.length) return 1;
        const pa = ta[i];
        const pb = tb[i];
        const na = /^\d+$/.test(pa);
        const nb = /^\d+$/.test(pb);
        if (na && nb) {
          const diff = Number(pa) - Number(pb);
          if (diff !== 0) return diff;
        } else {
          const cmp = pa.localeCompare(pb, "zh-Hans-CN");
          if (cmp !== 0) return cmp;
        }
      }
      return 0;
    }

    function compareStamps(a, b) {
      const ca = (a.code || "").trim();
      const cb = (b.code || "").trim();
      // 有志號優先於無志號（無志號如生肖／年冊則依名稱年份自然排序）
      if (ca && !cb) return -1;
      if (!ca && cb) return 1;
      if (ca && cb) {
        const codeCmp = naturalCompare(ca, cb);
        if (codeCmp !== 0) return codeCmp;
      }
      return naturalCompare(a.name, b.name);
    }

    // ==========================================
    // AES-256-GCM 解密
    // ==========================================
    function b64ToBytes(b64) {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    async function decryptDataEnc(envelope, password) {
      const enc = new TextEncoder();
      const keyMaterial = await crypto.subtle.importKey(
        "raw",
        enc.encode(password),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      const aesKey = await crypto.subtle.deriveKey(
        {
          name: "PBKDF2",
          salt: b64ToBytes(envelope.salt),
          iterations: Number(envelope.iter || 100000),
          hash: "SHA-256",
        },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["decrypt"]
      );
      const plainBuffer = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: b64ToBytes(envelope.iv) },
        aesKey,
        b64ToBytes(envelope.ct)
      );
      return JSON.parse(new TextDecoder().decode(plainBuffer));
    }

    function escapeHtml(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function fmtNum(val) {
      if (val === null || val === undefined) return '<span class="text-slate-300">--</span>';
      return Number(val).toLocaleString("zh-TW", { maximumFractionDigits: 2 });
    }

    function fmtDualPair(aVal, bVal, darkCls, lightCls) {
      return `
        <span class="${darkCls}">${fmtNum(aVal)}</span>
        <span class="text-slate-300 mx-0.5">/</span>
        <span class="${lightCls}">${fmtNum(bVal)}</span>
      `;
    }

    function cleanupCharts() {
      if (sparkObserver) {
        sparkObserver.disconnect();
        sparkObserver = null;
      }
      sparklineCharts.forEach(c => c.destroy());
      sparklineCharts.clear();
      expandedCharts.forEach(c => c.destroy());
      expandedCharts.clear();
    }

    function renderCategoryTabs() {
      const container = document.getElementById("categoryTabs");
      const counts = { "全部": stampList.length };
      for (const s of stampList) counts[s.category] = (counts[s.category] || 0) + 1;

      container.innerHTML = CATEGORIES.map(cat => {
        const active = cat === currentCategory;
        const cnt = counts[cat] || 0;
        const cls = active
          ? "bg-indigo-600 text-white"
          : "bg-slate-100 text-slate-700 hover:bg-slate-200";
        return `
          <button data-cat="${escapeHtml(cat)}" class="cat-btn px-3 py-1.5 rounded-full text-xs font-medium transition ${cls}">
            ${escapeHtml(cat)} <span class="opacity-75">(${cnt})</span>
          </button>`;
      }).join("");

      container.querySelectorAll(".cat-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          currentCategory = btn.dataset.cat;
          renderCategoryTabs();
          renderTable();
        });
      });
    }

    function renderDashboardSummary() {
      const totalChanges = stampList.reduce((acc, s) => acc + (s.history?.length || 0), 0);
      document.getElementById("statStamps").textContent = `${filteredList.length} / ${stampList.length}`;
      document.getElementById("statChanges").textContent = totalChanges;
      document.getElementById("statUpdated").textContent = storeData.updated_at || "-";
      document.getElementById("headerLastChecked").textContent = storeData.last_checked || "-";
    }

    function buildDatasets(hist, isSparkline) {
      const isSingle = hist.length === 1;
      const activeSeries = SERIES_CONFIG.filter(cfg =>
        hist.some(h => h[cfg.key] !== null && h[cfg.key] !== undefined)
      );
      return activeSeries.map(cfg => ({
        label: cfg.label,
        data: hist.map(h => h[cfg.key] ?? null),
        borderColor: cfg.color,
        backgroundColor: cfg.bg,
        borderDash: cfg.dash,
        borderWidth: isSparkline ? 1.75 : 2.2,
        tension: 0.22,
        spanGaps: true,
        pointRadius: isSparkline ? (isSingle ? 2.5 : 0) : 3.5,
        pointHoverRadius: isSparkline ? 3 : 5.5,
        pointBackgroundColor: cfg.color,
      }));
    }

    function drawSparkline(canvasEl, idx) {
      if (sparklineCharts.has(idx)) return;
      const item = filteredList[idx];
      if (!item || !item.history?.length) return;

      const hist = item.history.slice(-30);
      const datasets = buildDatasets(hist, true);
      if (!datasets.length) return;

      const chart = new Chart(canvasEl.getContext("2d"), {
        type: "line",
        data: { labels: hist.map(h => h.date), datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          interaction: { mode: "index", intersect: false },
          plugins: {
            legend: { display: false },
            tooltip: {
              enabled: true,
              callbacks: {
                label: c => `${c.dataset.label}: ${c.parsed.y !== null ? c.parsed.y + "元" : "--"}`,
              },
            },
          },
          scales: {
            x: { display: false },
            y: { display: false, beginAtZero: false },
          },
        },
      });
      sparklineCharts.set(idx, chart);
    }

    function toggleDetailRow(idx) {
      const detailRow = document.getElementById(`detail-row-${idx}`);
      const arrowEl = document.getElementById(`arrow-${idx}`);
      if (!detailRow) return;

      if (!detailRow.classList.contains("hidden")) {
        detailRow.classList.add("hidden");
        if (arrowEl) arrowEl.textContent = "▸";
        if (expandedCharts.has(idx)) {
          expandedCharts.get(idx).destroy();
          expandedCharts.delete(idx);
        }
        return;
      }

      detailRow.classList.remove("hidden");
      if (arrowEl) arrowEl.textContent = "▾";

      const item = filteredList[idx];
      const hist = item.history || [];
      const reversed = [...hist].reverse();
      const last = hist[hist.length - 1] || {};

      const panel = document.getElementById(`detail-panel-${idx}`);
      panel.innerHTML = `
        <div class="p-4 sm:p-5 space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 pb-3">
            <div class="flex items-center gap-2">
              <span class="font-bold text-slate-900 text-base">${escapeHtml(item.name)}</span>
              <span class="px-2 py-0.5 rounded bg-indigo-50 text-indigo-700 text-xs font-semibold">${escapeHtml(item.category)}</span>
              ${item.code ? `<span class="px-2 py-0.5 rounded bg-slate-200 text-slate-700 font-mono text-xs">${escapeHtml(item.code)}</span>` : ""}
            </div>
            <div class="text-xs text-slate-500">
              最近檢查：${escapeHtml(item.last_checked || "-")} · 共 ${hist.length} 筆紀錄
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div class="bg-white rounded-lg border border-emerald-200 p-3">
              <div class="text-xs text-emerald-800 font-medium">新票比價 (金投 vs 點購)</div>
              <div class="text-base font-bold mt-1 flex items-center gap-2">
                <span class="text-emerald-700">金投 ${fmtNum(last.site_a_mint)}</span>
                <span class="text-slate-300">|</span>
                <span class="text-emerald-500">點購 ${fmtNum(last.site_b_mint)}</span>
              </div>
            </div>
            <div class="bg-white rounded-lg border border-amber-200 p-3">
              <div class="text-xs text-amber-800 font-medium">蓋銷比價 (金投 vs 點購)</div>
              <div class="text-base font-bold mt-1 flex items-center gap-2">
                <span class="text-amber-700">金投 ${fmtNum(last.site_a_cto)}</span>
                <span class="text-slate-300">|</span>
                <span class="text-amber-500">點購 ${fmtNum(last.site_b_cto)}</span>
              </div>
            </div>
            <div class="bg-white rounded-lg border border-rose-200 p-3">
              <div class="text-xs text-rose-800 font-medium">信銷比價 (金投 vs 點購)</div>
              <div class="text-base font-bold mt-1 flex items-center gap-2">
                <span class="text-rose-700">金投 ${fmtNum(last.site_a_used)}</span>
                <span class="text-slate-300">|</span>
                <span class="text-rose-400">點購 ${fmtNum(last.site_b_used)}</span>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
            <div class="bg-white rounded-lg border border-slate-200 p-3">
              <div class="text-xs font-semibold text-slate-600 mb-2">雙站同色系深淺走勢對比圖（元）</div>
              <div class="relative h-60">
                <canvas id="expanded-chart-${idx}"></canvas>
              </div>
            </div>

            <div class="bg-white rounded-lg border border-slate-200 overflow-hidden">
              <div class="px-3 py-2 bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-600">
                雙站歷史報價明細表
              </div>
              <div class="max-h-60 overflow-auto">
                <table class="min-w-full divide-y divide-slate-100 text-xs">
                  <thead class="bg-white text-slate-500 sticky top-0">
                    <tr>
                      <th class="px-2.5 py-2 text-left font-medium">日期</th>
                      <th class="px-2 py-2 text-right font-medium text-emerald-700">金投新</th>
                      <th class="px-2 py-2 text-right font-medium text-emerald-500">點購新</th>
                      <th class="px-2 py-2 text-right font-medium text-amber-700">金投蓋</th>
                      <th class="px-2 py-2 text-right font-medium text-amber-500">點購蓋</th>
                      <th class="px-2 py-2 text-right font-medium text-rose-700">金投信</th>
                      <th class="px-2 py-2 text-right font-medium text-rose-400">點購信</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${reversed.map(r => `
                      <tr class="hover:bg-slate-50">
                        <td class="px-2.5 py-1.5 text-slate-700 whitespace-nowrap">${escapeHtml(r.date)}</td>
                        <td class="px-2 py-1.5 text-right font-medium text-emerald-700">${fmtNum(r.site_a_mint)}</td>
                        <td class="px-2 py-1.5 text-right font-medium text-emerald-500">${fmtNum(r.site_b_mint)}</td>
                        <td class="px-2 py-1.5 text-right font-medium text-amber-700">${fmtNum(r.site_a_cto)}</td>
                        <td class="px-2 py-1.5 text-right font-medium text-amber-500">${fmtNum(r.site_b_cto)}</td>
                        <td class="px-2 py-1.5 text-right font-medium text-rose-700">${fmtNum(r.site_a_used)}</td>
                        <td class="px-2 py-1.5 text-right font-medium text-rose-400">${fmtNum(r.site_b_used)}</td>
                      </tr>
                    `).join("")}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      `;

      const expCanvas = document.getElementById(`expanded-chart-${idx}`);
      if (expCanvas) {
        const expChart = new Chart(expCanvas.getContext("2d"), {
          type: "line",
          data: { labels: hist.map(h => h.date), datasets: buildDatasets(hist, false) },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: "index", intersect: false },
            plugins: {
              legend: { position: "top", labels: { boxWidth: 14, font: { size: 11 } } },
              tooltip: {
                callbacks: {
                  afterTitle: (items) => {
                    const i = items[0]?.dataIndex;
                    return i !== undefined && hist[i]?.ts ? `紀錄時間：${hist[i].ts}` : "";
                  },
                  label: c => `${c.dataset.label}: ${c.parsed.y !== null ? c.parsed.y + " 元" : "--"}`,
                },
              },
            },
            scales: {
              y: { beginAtZero: false, ticks: { callback: v => v + "元" } },
            },
          },
        });
        expandedCharts.set(idx, expChart);
      }
    }

    function renderTable() {
      cleanupCharts();
      const kw = document.getElementById("searchInput").value.trim().toLowerCase();

      filteredList = stampList
        .filter(item => {
          if (currentCategory !== "全部" && item.category !== currentCategory) return false;
          if (kw && !`${item.name} ${item.code}`.toLowerCase().includes(kw)) return false;
          return true;
        })
        .sort(compareStamps);

      renderDashboardSummary();

      const tbody = document.getElementById("stampTableBody");
      if (!filteredList.length) {
        tbody.innerHTML = `<tr><td colspan="9" class="px-4 py-10 text-center text-slate-400">查無符合條件的郵票資料</td></tr>`;
        return;
      }

      tbody.innerHTML = filteredList.map((item, idx) => {
        const latest = item.history?.[item.history.length - 1] || {};
        return `
          <tr data-idx="${idx}" class="stamp-row hover:bg-indigo-50/40 cursor-pointer transition h-[54px]">
            <td class="px-3 py-1.5 font-mono text-xs text-slate-600 font-semibold whitespace-nowrap">${escapeHtml(item.code || "-")}</td>
            <td class="px-3 py-1.5 font-medium text-slate-900">${escapeHtml(item.name)}</td>
            <td class="px-3 py-1.5 text-center">
              <span class="px-2 py-0.5 rounded bg-slate-100 text-slate-700 text-xs font-medium">${escapeHtml(item.category)}</span>
            </td>
            <td class="px-3 py-1.5 text-right font-semibold whitespace-nowrap text-xs">
              ${fmtDualPair(latest.site_a_mint, latest.site_b_mint, "text-emerald-700", "text-emerald-500")}
            </td>
            <td class="px-3 py-1.5 text-right font-semibold whitespace-nowrap text-xs">
              ${fmtDualPair(latest.site_a_cto, latest.site_b_cto, "text-amber-700", "text-amber-500")}
            </td>
            <td class="px-3 py-1.5 text-right font-semibold whitespace-nowrap text-xs">
              ${fmtDualPair(latest.site_a_used, latest.site_b_used, "text-rose-700", "text-rose-400")}
            </td>
            <td class="px-3 py-1">
              <div class="w-40 h-[42px] mx-auto relative">
                <canvas class="sparkline-canvas" data-idx="${idx}"></canvas>
              </div>
            </td>
            <td class="px-3 py-1.5 text-center text-xs text-slate-500 whitespace-nowrap">${escapeHtml(latest.date || "-")}</td>
            <td class="px-3 py-1.5 text-center text-indigo-600 font-bold select-none">
              <span id="arrow-${idx}">▸</span>
            </td>
          </tr>
          <tr id="detail-row-${idx}" class="hidden bg-slate-50/90">
            <td id="detail-panel-${idx}" colspan="9" class="p-0 border-t border-indigo-100"></td>
          </tr>
        `;
      }).join("");

      tbody.querySelectorAll(".stamp-row").forEach(row => {
        row.addEventListener("click", () => toggleDetailRow(Number(row.dataset.idx)));
      });

      sparkObserver = new IntersectionObserver(
        (entries) => {
          for (const entry of entries) {
            if (entry.isIntersecting) {
              const canvas = entry.target;
              drawSparkline(canvas, Number(canvas.dataset.idx));
              sparkObserver.unobserve(canvas);
            }
          }
        },
        { rootMargin: "150px 0px" }
      );

      tbody.querySelectorAll(".sparkline-canvas").forEach(canvas => sparkObserver.observe(canvas));
    }

    document.getElementById("unlockForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const pwInput = document.getElementById("passwordInput");
      const errBox = document.getElementById("authError");
      const btn = document.getElementById("unlockBtn");
      const password = pwInput.value;

      errBox.classList.add("hidden");
      btn.disabled = true;
      btn.textContent = "正在下載並解密資料...";

      try {
        const res = await fetch(`./data.enc?t=${Date.now()}`, { cache: "no-store" });
        if (!res.ok) throw new Error(`無法載入加密資料檔 (HTTP ${res.status})`);
        const envelope = await res.json();

        storeData = await decryptDataEnc(envelope, password);
        stampList = Object.values(storeData.stamps || {}).sort(compareStamps);

        pwInput.value = "";
        document.getElementById("lockScreen").classList.add("hidden");
        document.getElementById("appScreen").classList.remove("hidden");

        renderCategoryTabs();
        renderTable();
      } catch (err) {
        errBox.textContent = err.message.includes("HTTP")
          ? err.message
          : "密碼錯誤或資料無法解密，請重新確認。";
        errBox.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.textContent = "解密並載入儀表板";
      }
    });

    let searchTimer = null;
    document.getElementById("searchInput").addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(renderTable, 180);
    });

    document.getElementById("lockBtn").addEventListener("click", () => {
      cleanupCharts();
      storeData = null;
      stampList = [];
      filteredList = [];
      document.getElementById("stampTableBody").innerHTML = "";
      document.getElementById("appScreen").classList.add("hidden");
      document.getElementById("lockScreen").classList.remove("hidden");
    });
  </script>
</body>
</html>
