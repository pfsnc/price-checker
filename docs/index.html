<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>中國郵票雙站行情私人追蹤系統</title>
  <link rel="stylesheet" href="./css/styles.css" />
  <script src="./vendor/chart.umd.min.js" defer></script>
  <script src="./js/app.js" defer></script>
</head>
<body data-api-url="https://stamp-api.fsiu949896.workers.dev/api/data" class="bg-slate-50 text-slate-800 min-h-screen">

  <!-- 密碼鎖定驗證畫面 -->
  <section id="lockScreen" class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-white rounded-2xl border border-slate-200 shadow-lg p-7 space-y-5">
      <div class="text-center space-y-1.5">
        <div class="mx-auto w-12 h-12 rounded-full bg-indigo-50 text-indigo-600 flex items-center justify-center text-xl font-bold">
          🔐
        </div>
        <h1 class="text-xl font-bold text-slate-900">私人郵票雙站比價系統</h1>
        <p class="text-xs text-slate-500">資料以 AES-256-GCM 加密儲存，請輸入解密密碼</p>
      </div>

      <form id="unlockForm" class="space-y-4">
        <div>
          <label for="passwordInput" class="block text-xs font-medium text-slate-600 mb-1">存取密碼</label>
          <input id="passwordInput" type="password" required autocomplete="current-password"
            placeholder="輸入 GitHub Secret 設定之密碼"
            class="w-full px-3.5 py-2.5 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
        <div id="authError" class="hidden text-xs text-rose-700 bg-rose-50 border border-rose-200 rounded-lg p-2.5"></div>
        <button id="unlockBtn" type="submit"
          class="w-full py-2.5 px-4 rounded-lg bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white text-sm font-medium transition shadow-sm">
          解密並載入儀表板
        </button>
      </form>
    </div>
  </section>

  <!-- 已解密主畫面 -->
  <div id="appScreen" class="hidden">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20">
      <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-3 flex items-center justify-between gap-2">
        <div class="min-w-0">
          <h1 class="text-base sm:text-xl font-bold text-slate-900 truncate">中國郵票雙站行情追蹤</h1>
          <p class="text-[11px] sm:text-xs text-slate-500 mt-0.5 truncate">
            最後檢查：<span id="headerLastChecked" class="font-medium text-slate-700">-</span>
          </p>
        </div>

        <div class="flex items-center gap-2 sm:gap-3 shrink-0">
          <div class="hidden lg:flex items-center gap-x-3.5 text-[11px] text-slate-600 bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5">
            <span class="inline-flex items-center gap-1"><span class="w-3 h-0.5 bg-emerald-700"></span>新票(金投)</span>
            <span class="inline-flex items-center gap-1"><span class="w-3 h-0.5 border-t-2 border-dashed border-emerald-400"></span>新票(點購)</span>
            <span class="inline-flex items-center gap-1"><span class="w-3 h-0.5 bg-amber-700"></span>蓋銷(金投)</span>
            <span class="inline-flex items-center gap-1"><span class="w-3 h-0.5 border-t-2 border-dashed border-amber-400"></span>蓋銷(點購)</span>
            <span class="inline-flex items-center gap-1"><span class="w-3 h-0.5 bg-rose-700"></span>信銷(金投)</span>
            <span class="inline-flex items-center gap-1"><span class="w-3 h-0.5 border-t-2 border-dashed border-rose-400"></span>信銷(點購)</span>
          </div>
          <button id="lockBtn" type="button"
            class="px-3 py-1.5 rounded-lg border border-slate-300 bg-white hover:bg-slate-100 text-xs font-medium text-slate-700 transition">
            鎖定
          </button>
        </div>
      </div>
    </header>

    <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-5 space-y-4 sm:space-y-5">
      <section class="grid grid-cols-3 gap-2 sm:gap-4">
        <div class="bg-white rounded-xl border border-slate-200 p-2.5 sm:p-4 shadow-sm">
          <div class="text-[11px] sm:text-xs text-slate-500 truncate">顯示 / 總品種</div>
          <div id="statStamps" class="text-base sm:text-2xl font-bold text-slate-900 mt-0.5 sm:mt-1">-</div>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 p-2.5 sm:p-4 shadow-sm">
          <div class="text-[11px] sm:text-xs text-slate-500 truncate">價格快照數</div>
          <div id="statChanges" class="text-base sm:text-2xl font-bold text-slate-900 mt-0.5 sm:mt-1">-</div>
        </div>
        <div class="bg-white rounded-xl border border-slate-200 p-2.5 sm:p-4 shadow-sm">
          <div class="text-[11px] sm:text-xs text-slate-500 truncate">最後更新時間</div>
          <div id="statUpdated" class="text-xs sm:text-lg font-bold text-indigo-600 mt-1 sm:mt-1.5 truncate">-</div>
        </div>
      </section>

      <section class="bg-white rounded-xl border border-slate-200 p-3 sm:p-4 shadow-sm space-y-3 md:space-y-0 md:flex md:items-center md:justify-between md:gap-3">
        <div id="categoryTabs" class="flex flex-nowrap md:flex-wrap items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5 md:pb-0"></div>
        <div class="w-full md:w-72 shrink-0">
          <input id="searchInput" type="text" placeholder="搜尋名稱或志號（如：T46、文1、猴）"
            class="w-full px-3 py-1.5 sm:py-2 text-sm border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
      </section>

      <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
        <div class="overflow-x-auto">
          <table class="min-w-full divide-y divide-slate-200 text-sm">
            <thead id="stampTableHead" class="bg-slate-50 text-slate-600 text-xs uppercase tracking-wider"></thead>
            <tbody id="stampTableBody" class="divide-y divide-slate-100 bg-white"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
